services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kcm
      POSTGRES_PASSWORD: kcm
      POSTGRES_DB: kcm
    ports:
      - "5432:5432" # for local runs and tests outside Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcm"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    env_file: .env # KEITARO_API_KEY and optional overrides, see .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://kcm:kcm@db:5432/kcm
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
